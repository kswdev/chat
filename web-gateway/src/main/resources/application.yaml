spring:
  application:
    name: web-gateway
  cloud:
    config.enabled: false
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: '*'
            allowCredentials: false
            allowedHeaders: '*'
            allowedMethods: '*'

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
        - name: LoggingFilter
          args:
            baseMessage: Spring Cloud Gateway Filter
            preLogger: true
            postLogger: true

      routes:
        - id: message-auth
          uri: http://localhost:8081/
          predicates:
            - Path=/api/v1/auth/**

        - id: message-user-register
          uri: http://localhost:8082/
          predicates:
            - Path=/api/v1/user/register

        - id: message-user-unregister
          uri: http://localhost:8082/
          predicates:
            - Path=/api/v1/user/unregister
          filters:
            - AuthorizationHeaderFilter

        - id: websocket-route-message
          uri: ws://localhost:8090/
          predicates:
            - Path=/ws/v1/message
          filters:
            - AuthorizationHeaderFilter


### jwt
security.jwt:
  secret-key: 1234
  expiration-time: 3600000

### logging
logging:
  level:
    org.springframework.cloud.gateway: info
    reactor.netty: info

### actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  metrics:
    tags:
      application: web-gateway

  endpoint:
    prometheus:
      access: unrestricted

  tracing:
    sampling:
      probability: 1.0   # 개발/테스트 중엔 100% 샘플링, 운영에선 0.1 등으로 낮춤
  otlp:
    tracing:
      endpoint: http://localhost:14318/v1/traces