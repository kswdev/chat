apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-gateway
  namespace: chat-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-gateway
  template:
    metadata:
      labels:
        app: web-gateway
    spec:
      containers:
        - name: web-gateway
          image: web-gateway:local
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "400m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: web-gateway
  namespace: chat-system
  labels:
    app: web-gateway
spec:
  type: NodePort
  selector:
    app: web-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
