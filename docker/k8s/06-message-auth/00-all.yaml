apiVersion: v1
kind: ConfigMap
metadata:
  name: message-auth-config
  namespace: chat-system
data:
  SOURCE_DB_URL: "jdbc:mysql://mysql-source.chat-system.svc.cluster.local:3306/chat?useSSL=false&allowPublicKeyRetrieval=true"
  REPLICA_DB_URL: "jdbc:mysql://mysql-replica.chat-system.svc.cluster.local:3306/chat?useSSL=false&allowPublicKeyRetrieval=true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-auth
  namespace: chat-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message-auth
  template:
    metadata:
      labels:
        app: message-auth
    spec:
      containers:
        - name: message-auth
          image: message-auth:local
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: message-auth-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: mysql-credentials, key: MYSQL_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-credentials, key: MYSQL_PASSWORD }
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "400m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: message-auth
  namespace: chat-system
spec:
  selector:
    app: message-auth
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: message-auth
  namespace: chat-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: message-auth
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: message-auth
  namespace: chat-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: message-auth
