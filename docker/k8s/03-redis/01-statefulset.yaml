apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-headless
  namespace: chat-system
  labels:
    app: redis-cluster
spec:
  clusterIP: None
  # Kafka와 같은 이유입니다 — 6개 노드가 클러스터를 처음 구성할 때 서로를
  # Ready 되기 전부터 찾아야 해서, 존재하는 즉시 DNS에 등록되게 합니다.
  publishNotReadyAddresses: true
  selector:
    app: redis-cluster
  ports:
    - name: client
      port: 6379
    - name: bus
      port: 16379
    - name: metrics
      port: 9121
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: chat-system
spec:
  serviceName: redis-cluster-headless
  replicas: 6
  # 처음엔 OrderedReady + PING 기반 readiness면 괜찮을 거라 판단했는데, 실제로는
  # bitnami 이미지가 자기가 creator든 아니든 시작할 때 REDIS_NODES에 적힌 6개
  # 상대가 전부 존재하는지부터 확인하려고 합니다. 그래서 Kafka와 똑같이 6개를
  # 동시에 띄워야 서로를 바로 찾을 수 있습니다.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      containers:
        - name: redis
          image: bitnamilegacy/redis-cluster:7.4.1
          command: ["sh", "-c"]
          args:
            - |
              ORD=${HOSTNAME##*-}
              # 자기 자신을 다른 노드들에게 어떤 IP로 알릴지(announce) 정하는 부분입니다.
              # 쿠버네티스에서는 pod IP가 재시작마다 바뀌기 때문에, 매번 "지금 내 IP가 뭔지"를
              # Downward API로 받아온 $POD_IP를 읽어서 그때그때 새로 알립니다.
              export REDIS_CLUSTER_ANNOUNCE_IP=$POD_IP
              export REDIS_CLUSTER_ANNOUNCE_PORT=6379
              export REDIS_CLUSTER_ANNOUNCE_BUS_PORT=16379
              # 6개 중 마지막(ordinal 5)만 "클러스터를 처음 만드는 사람" 역할을 합니다.
              # 나머지 5개는 그냥 자기 자신을 띄우고 클러스터에 합류하길 기다립니다.
              if [ "$ORD" = "5" ]; then
                export REDIS_CLUSTER_CREATOR=yes
              fi
              exec /opt/bitnami/scripts/redis-cluster/entrypoint.sh /opt/bitnami/scripts/redis-cluster/run.sh
          envFrom:
            - configMapRef:
                name: redis-cluster-config
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 6379
              name: client
            - containerPort: 16379
              name: bus
          volumeMounts:
            - name: data
              mountPath: /bitnami/redis/data
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "6379", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", "6379", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 20
        # 사이드카: 같은 pod 안에서 로컬(localhost)로 자기 자신의 redis만 모니터링합니다.
        # 6개 pod 전부 이 컨테이너를 갖게 되니, 결과적으로 "노드마다 자기 지표를 내보내는"
        # 구조가 되고, Prometheus가 headless Service를 통해 6개를 각각 별도 타겟으로 긁습니다.
        - name: redis-exporter
          image: oliver006/redis_exporter:latest
          env:
            - name: REDIS_ADDR
              value: "redis://localhost:6379"
            - name: REDIS_EXPORTER_CHECK_STREAMS
              value: "ws:deliver:*"
          ports:
            - containerPort: 9121
              name: metrics
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "100m", memory: "128Mi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
