# MySQL 때와 같은 이유로 headless Service를 씁니다: kafka-0, kafka-1, kafka-2가
# 서로 고정된 이름으로 찾아야(quorum 통신, replication) 하기 때문입니다.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: chat-system
spec:
  clusterIP: None
  # 기본값(false)이면 Ready인 pod만 DNS에 등록됩니다. 근데 KRaft quorum은 서로를
  # "Ready 되기 전"부터 찾아야 하는 구조라, 이걸 켜서 pod가 존재하기만 하면
  # DNS에 바로 등록되도록 합니다. (부트스트랩 단계의 닭-달걀 문제 회피)
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: chat-system
spec:
  serviceName: kafka-headless
  replicas: 3
  # KRaft quorum은 3개가 부트스트랩 단계부터 서로를 봐야 해서, 기본값인 OrderedReady로는
  # "누구도 먼저 Ready가 안 돼서 아무도 안 생성되는" 교착 상태에 빠집니다.
  # Parallel로 셋을 동시에 띄워야 서로를 바로 찾을 수 있습니다.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          # StatefulSet 덕분에 pod 이름이 kafka-0, kafka-1, kafka-2 로 고정됩니다.
          # 이 스크립트는 시작 시점에 $HOSTNAME 뒤에 붙은 숫자(ordinal)를 뽑아내서
          # 그걸 NODE_ID로 쓰고, 자기 자신을 가리키는 광고 주소(ADVERTISED_LISTENERS)를
          # 동적으로 만든 뒤, 원래 이미지의 기동 스크립트를 이어서 실행합니다.
          # 참고: 이미지 내부 기동 스크립트 경로(/etc/kafka/docker/run)는 apache/kafka
          # 이미지 버전에 따라 달라질 수 있어요. 만약 컨테이너가 바로 죽으면
          # `docker run --entrypoint sh -it apache/kafka:4.1.0` 으로 열어서 실제 경로를 확인해주세요.
          command: ["sh", "-c"]
          args:
            - |
              ORD=${HOSTNAME##*-}
              export KAFKA_NODE_ID=$ORD
              export KAFKA_ADVERTISED_LISTENERS="INTERNAL://kafka-${ORD}.kafka-headless.chat-system.svc.cluster.local:9092"
              exec /etc/kafka/docker/run
          envFrom:
            - configMapRef:
                name: kafka-common-config
          ports:
            - containerPort: 9092
              name: internal
            - containerPort: 9093
              name: controller
          volumeMounts:
            - name: data
              mountPath: /bitnami/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 40
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi