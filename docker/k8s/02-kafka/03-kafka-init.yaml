apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: chat-system
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z kafka-0.kafka-headless.chat-system.svc.cluster.local 9092; do echo waiting for kafka; sleep 3; done"
      containers:
        - name: create-topics
          image: apache/kafka:4.1.0
          command:
            - sh
            - -c
            - |
              set -e
              BOOTSTRAP=kafka-0.kafka-headless.chat-system.svc.cluster.local:9092

              create_topic() {
                /opt/kafka/bin/kafka-topics.sh --create \
                  --bootstrap-server $BOOTSTRAP \
                  --topic "$1" \
                  --partitions 6 \
                  --replication-factor 3 \
                  --if-not-exists
              }

              create_topic push-notification
              create_topic message-relay
              create_topic message-request

              echo "=== 생성된 topic 목록 ==="
              /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server $BOOTSTRAP