# message-social 전용 DB. 트래픽 규모상 source 단일로 충분하다고 판단해 replica는 두지 않는다
# (다른 소스들과 달리 --log_bin/--gtid-mode 등 복제용 플래그도 생략).
apiVersion: v1
kind: Service
metadata:
  name: mysql-source-social
  namespace: chat-system
spec:
  clusterIP: None
  selector:
    app: mysql-source-social
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-source-social
  namespace: chat-system
spec:
  serviceName: mysql-source-social
  replicas: 1
  selector:
    matchLabels:
      app: mysql-source-social
  template:
    metadata:
      labels:
        app: mysql-source-social
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.40
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-credentials, key: MYSQL_ROOT_PASSWORD }
            - name: MYSQL_DATABASE
              value: social
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: { name: mysql-credentials, key: MYSQL_USER }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-credentials, key: MYSQL_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: init-scripts
          configMap:
            name: mysql-init-source-social
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
