# 로컬 학습용이라 stringData로 평문 작성 (실제 운영에서는 절대 이렇게 커밋하면 안 됨 —
# 나중에 SealedSecrets나 외부 시크릿 매니저로 교체하는 걸 권장)
# message-system -> message-social 내부 전용 엔드포인트(/connections/accepted-count) 인증용.
# mysql-credentials와 같은 폴더에 둔 이유는 이 폴더가 "네임스페이스 부트스트랩 시 함께 적용하는
# 공유 시크릿" 위치로 이미 쓰이고 있어서(01-secret.yaml도 mysql 전용이 아니라 여러 서비스가 공유).
apiVersion: v1
kind: Secret
metadata:
  name: internal-api-credentials
  namespace: chat-system
type: Opaque
stringData:
  INTERNAL_API_KEY: dev-only-internal-api-key
