# headless Service: ClusterIP를 None으로 주면 로드밸런싱용 가상 IP를 만들지 않고,
# 대신 이 이름으로 조회하면 뒤에 붙은 Pod의 실제 IP를 그대로 돌려줍니다.
# StatefulSet과 짝을 이루면 mysql-source-message2-0.mysql-source-message2 같은 고정 DNS가 생겨서,
# replica가 "이 소스"를 항상 같은 이름으로 찾아갈 수 있게 됩니다.
apiVersion: v1
kind: Service
metadata:
  name: mysql-source-message2
  namespace: chat-system
spec:
  clusterIP: None
  selector:
    app: mysql-source-message2
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-source-message2
  namespace: chat-system
spec:
  serviceName: mysql-source-message2
  replicas: 1
  selector:
    matchLabels:
      app: mysql-source-message2
  template:
    metadata:
      labels:
        app: mysql-source-message2
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.40
          args:
            - --server-id=5
            - --log_bin=/var/lib/mysql/mysql-bin.log
            - --binlog-format=ROW
            - --enforce-gtid-consistency=ON
            - --gtid-mode=ON
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-credentials, key: MYSQL_ROOT_PASSWORD }
            - name: MYSQL_DATABASE
              value: chat
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: { name: mysql-credentials, key: MYSQL_USER }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-credentials, key: MYSQL_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          # readiness/liveness: kubelet이 이 명령의 종료 코드로 컨테이너 상태를 판단합니다.
          # 여기가 계속 실패하면 컨트롤러가 "실제 상태 != 목표 상태"로 보고 재시작을 시도합니다.
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: init-scripts
          configMap:
            name: mysql-init-source-message2
  # volumeClaimTemplates: StatefulSet만의 기능입니다. Deployment는 모든 Pod가 볼륨을
  # 공유하거나 아예 없는 걸 전제로 하는데, StatefulSet은 Pod마다 "자기만의" PVC를
  # 자동으로 만들어줍니다. Pod가 재시작돼도 같은 PVC에 다시 붙어서 데이터가 유지됩니다.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
