# 로컬 학습용이라 stringData로 평문 작성 (실제 운영에서는 절대 이렇게 커밋하면 안 됨 —
# 나중에 SealedSecrets나 외부 시크릿 매니저로 교체하는 걸 권장)
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: chat-system
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root_password
  MYSQL_USER: dev_user
  MYSQL_PASSWORD: dev_password
