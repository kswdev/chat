apiVersion: v1
kind: ConfigMap
metadata:
  name: message-user-config
  namespace: chat-system
data:
  SOURCE_DB_URL: "jdbc:mysql://mysql-source.chat-system.svc.cluster.local:3306/chat?useSSL=false&allowPublicKeyRetrieval=true"
  REPLICA_DB_URL: "jdbc:mysql://mysql-replica.chat-system.svc.cluster.local:3306/chat?useSSL=false&allowPublicKeyRetrieval=true"
  REDIS_CLUSTER_NODES: >-
    redis-cluster-0.redis-cluster-headless.chat-system.svc.cluster.local:6379,
    redis-cluster-1.redis-cluster-headless.chat-system.svc.cluster.local:6379,
    redis-cluster-2.redis-cluster-headless.chat-system.svc.cluster.local:6379,
    redis-cluster-3.redis-cluster-headless.chat-system.svc.cluster.local:6379,
    redis-cluster-4.redis-cluster-headless.chat-system.svc.cluster.local:6379,
    redis-cluster-5.redis-cluster-headless.chat-system.svc.cluster.local:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-user
  namespace: chat-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message-user
  template:
    metadata:
      labels:
        app: message-user
    spec:
      containers:
        - name: message-user
          image: message-user:local
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: message-user-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: mysql-credentials, key: MYSQL_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-credentials, key: MYSQL_PASSWORD }
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "400m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: message-user
  namespace: chat-system
  labels:
    app: message-system
spec:
  selector:
    app: message-user
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: message-user
  namespace: chat-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: message-user
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: message-user
  namespace: chat-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: message-user
