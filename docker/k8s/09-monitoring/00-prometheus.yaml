# 원본 prometheus.yml과 구조는 완전히 동일합니다. host.docker.internal:포트 였던 걸
# k8s Service 이름(같은 네임스페이스 안이면 포트만 붙여도 됨, 여긴 다른 네임스페이스인
# chat-system을 가리켜야 해서 <서비스>.<네임스페이스>.svc.cluster.local로 명시했습니다)으로만
# 바꿨고, 원래 없던 message-connection-flux/message-auth/message-user도 같이 추가했습니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: web-gateway
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - web-gateway.chat-system.svc.cluster.local:8080

      - job_name: message-system
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - message-system.chat-system.svc.cluster.local:8070

      - job_name: message-connection-flux
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - message-connection-flux.chat-system.svc.cluster.local:8090

      - job_name: message-auth
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - message-auth.chat-system.svc.cluster.local:8081

      - job_name: message-user
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - message-user.chat-system.svc.cluster.local:8082

      - job_name: kafka-exporter
        static_configs:
          - targets:
              - kafka-exporter:9308   # 같은 monitoring 네임스페이스 안이라 짧은 이름으로 충분
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
