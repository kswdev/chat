# 예전엔 host.docker.internal:29094~29096(EXTERNAL_DOCKER 리스너)로 접속했는데,
# 이제 kafka-exporter 자신도 클러스터 안에 있으니 다른 앱들과 똑같이
# INTERNAL 리스너(9092)로 바로 접속하면 됩니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:latest
          args:
            - --kafka.server=kafka-0.kafka-headless.chat-system.svc.cluster.local:9092
            - --kafka.server=kafka-1.kafka-headless.chat-system.svc.cluster.local:9092
            - --kafka.server=kafka-2.kafka-headless.chat-system.svc.cluster.local:9092
            - --kafka.version=3.8.1
          ports:
            - containerPort: 9308
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: monitoring
  labels:
    # kube-prometheus-stack의 Prometheus가 "release: <helm release 이름>" 라벨이 붙은
    # ServiceMonitor만 인식하도록 기본 설정돼 있어서, 여기도 맞춰줍니다.
    release: prometheus-stack
spec:
  selector:
    app: kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: 9308
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-exporter
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: kafka-exporter
  endpoints:
    - port: metrics
      interval: 15s
