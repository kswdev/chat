# ⚠️ 원본 compose가 image: influxdb:latest 였는데, INFLUXDB_ADMIN_ENABLED 같은 env는
# InfluxDB 1.x 방식 설정이에요. "latest" 태그는 지금 2.x를 가리킬 가능성이 높아서, 이
# env들이 그냥 무시되고 admin 계정이 의도대로 안 만들어질 수 있습니다. 원래 쓰시던 대로
# 1.x였다는 전제로 태그를 1.8로 고정했어요 — 만약 2.x로 실제 쓰고 계셨다면 알려주세요,
# 설정 방식이 완전히 달라서(버킷/토큰 개념) 다시 만들어드려야 해요.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
        - name: influxdb
          image: influxdb:1.8
          env:
            - name: INFLUXDB_ADMIN_ENABLED
              value: "true"
            - name: INFLUXDB_ADMIN_USER
              value: "admin"
            - name: INFLUXDB_ADMIN_PASSWORD
              value: "admin"
          ports:
            - containerPort: 8086
          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb
      volumes:
        - name: data
          emptyDir: {}   # 부하테스트용 임시 데이터라 PVC까진 필요 없다고 판단했습니다.
                         # 재시작하면 날아가는 게 싫으시면 PVC로 바꿔드릴게요.
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: monitoring
spec:
  selector:
    app: influxdb
  ports:
    - port: 8086
      targetPort: 8086
