    volumes:
      - ./data/redis-insight:/data

  kafka1:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    ports:
      - "19094:9094"   # 기존 그대로 - localhost:19094 (호스트 애플리케이션용, EXTERNAL_HOST)
      - "29094:9095"   # 신규 추가 - host.docker.internal:29094 (Docker 컨테이너용, EXTERNAL_DOCKER)
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_KRAFT_CLUSTER_ID=2ce827af-446c-456f-9bf9-c2de30f1d3b5
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_LISTENERS=INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL_HOST://:9094,EXTERNAL_DOCKER://:9095
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka1:9092,EXTERNAL_HOST://localhost:19094,EXTERNAL_DOCKER://host.docker.internal:29094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL_HOST:PLAINTEXT,EXTERNAL_DOCKER:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_MIN_INSYNC_REPLICAS=2
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_LOG_DIRS=/bitnami/kafka/data
    volumes:
      - ./data/kafka1:/bitnami/kafka/data

  kafka2:
