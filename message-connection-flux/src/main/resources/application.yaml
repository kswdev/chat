server:
  port: 8090

app:
  pod-name: ${POD_NAME:local}

spring:
  application.name: message-connection-flux

  data:
    redis:
      cluster:
        # 쉼표로 구분된 문자열 하나를 그대로 List<String>에 바인딩하는 Spring Boot의
        # relaxed binding을 이용합니다. k8s에서는 ConfigMap(REDIS_CLUSTER_NODES)이,
        # 로컬에서는 기본값이 채워줍니다.
        nodes: ${REDIS_CLUSTER_NODES:localhost:6380,localhost:6381,localhost:6382,localhost:6383,localhost:6384,localhost:6385}
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19094,localhost:19095,localhost:19096}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        delivery.timeout.ms: 10000
        request.timeout.ms: 3000
        retry.backoff.ms: 100

    template:
      observation-enabled: true
    listener:
      observation-enabled: true

message-system:
  kafka:
    topics:
      message: message-relay
      request: message-request
      push: push-notification

  redis:
    channel-prefix: ws:deliver

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    tags:
      application: message-connection-flux

  tracing:
    sampling:
      probability: 1.0   # 개발/테스트 중엔 100% 샘플링, 운영에선 0.1 등으로 낮춤
  otlp:
    tracing:
      endpoint: http://tempo.monitoring.svc.cluster.local:4318/v1/traces

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
    sun.rmi: info
    javax.management: info
    root: info

