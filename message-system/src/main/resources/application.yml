server:
  port: 8070
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: message-system
  datasource:
    source:
      hikari:
        jdbc-url: ${SOURCE_DB_URL:jdbc:mysql://localhost:13306/chat?useSSL=false&allowPublicKeyRetrieval=true}
        username: ${DB_USERNAME:dev_user}
        password: ${DB_PASSWORD:dev_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        pool-name: SourceConnectionPool
        minimum-idle: 10
        maximum-pool-size: 20
        idle-timeout: 60000
        connection-timeout: 30000

    replica:
      hikari:
        jdbc-url: ${REPLICA_DB_URL:jdbc:mysql://localhost:13307/chat?useSSL=false&allowPublicKeyRetrieval=true}
        username: ${DB_USERNAME:dev_user}
        password: ${DB_PASSWORD:dev_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        pool-name: ReplicaConnectionPool
        minimum-idle: 10
        maximum-pool-size: 20
        idle-timeout: 60000
        connection-timeout: 30000

    source-message1:
      hikari:
        jdbc-url: ${SOURCE_MESSAGE1_DB_URL:jdbc:mysql://localhost:13308/chat?useSSL=false&allowPublicKeyRetrieval=true}
        username: ${DB_USERNAME:dev_user}
        password: ${DB_PASSWORD:dev_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        pool-name: SourceMessage1ConnectionPool
        minimum-idle: 10
        maximum-pool-size: 20
        idle-timeout: 60000
        connection-timeout: 30000

    replica-message1:
      hikari:
        jdbc-url: ${REPLICA_MESSAGE1_DB_URL:jdbc:mysql://localhost:13309/chat?useSSL=false&allowPublicKeyRetrieval=true}
        username: ${DB_USERNAME:dev_user}
        password: ${DB_PASSWORD:dev_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        pool-name: ReplicaMessage1ConnectionPool
        minimum-idle: 10
        maximum-pool-size: 20
        idle-timeout: 60000
        connection-timeout: 30000

    source-message2:
      hikari:
        jdbc-url: ${SOURCE_MESSAGE2_DB_URL:jdbc:mysql://localhost:13310/chat?useSSL=false&allowPublicKeyRetrieval=true}
        username: ${DB_USERNAME:dev_user}
        password: ${DB_PASSWORD:dev_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        pool-name: SourceMessage2ConnectionPool
        minimum-idle: 10
        maximum-pool-size: 20
        idle-timeout: 60000
        connection-timeout: 30000

    replica-message2:
      hikari:
        jdbc-url: ${REPLICA_MESSAGE2_DB_URL:jdbc:mysql://localhost:13311/chat?useSSL=false&allowPublicKeyRetrieval=true}
        username: ${DB_USERNAME:dev_user}
        password: ${DB_PASSWORD:dev_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        pool-name: ReplicaMessage2ConnectionPool
        minimum-idle: 10
        maximum-pool-size: 20
        idle-timeout: 60000
        connection-timeout: 30000

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  sql.init.mode: never

  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:localhost:6380,localhost:6381,localhost:6382,localhost:6383,localhost:6384,localhost:6385}
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19094,localhost:19095,localhost:19096}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        delivery.timeout.ms: 10000
        request.timeout.ms: 3000
        retry.backoff.ms: 100

    consumer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      auto-offset-reset: latest
      properties:
        allow.auto.create.topics: false
        enable.auto.commit: false
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

    template:
      observation-enabled: true
    listener:
      observation-enabled: true

message-system:
  kafka:
    topics:
      push: push-notification
    listeners:
      message:
        topic: message-relay
        group-id: relay-group
        concurrency: 3
      request:
        topic: message-request
        group-id: request-group
        concurrency: 3
  # message-connection-flux의 PodIdentity가 구독하는 채널 접두어와 반드시 일치해야 합니다.
  redis:
    channel-prefix: ws:deliver

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    tags:
      application: message-system-service
  tracing:
    sampling:
      probability: 1.0   # 개발/테스트 중엔 100% 샘플링, 운영에선 0.1 등으로 낮춤
  otlp:
    tracing:
      endpoint: http://tempo.monitoring.svc.cluster.local:4318/v1/traces

logging:
  level:
    org.hibernate.orm.jdbc.bind: error
    sun.rmi: info
    javax.management: info
    root: info
