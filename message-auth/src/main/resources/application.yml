server.port: 8081

spring:
  application:
    name: message-auth
  datasource:
    source:
      hikari:
        jdbc-url: ${SOURCE_DB_URL:jdbc:mysql://localhost:13306/chat?useSSL=false&allowPublicKeyRetrieval=true}
        username: ${DB_USERNAME:dev_user}
        password: ${DB_PASSWORD:dev_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        pool-name: SourceConnectionPool
        minimum-idle: 10
        maximum-pool-size: 20
        idle-timeout: 60000
        connection-timeout: 30000

    replica:
      hikari:
        jdbc-url: ${REPLICA_DB_URL:jdbc:mysql://localhost:13307/chat?useSSL=false&allowPublicKeyRetrieval=true}
        username: ${DB_USERNAME:dev_user}
        password: ${DB_PASSWORD:dev_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        pool-name: ReplicaConnectionPool
        minimum-idle: 10
        maximum-pool-size: 20
        idle-timeout: 60000
        connection-timeout: 30000

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  metrics:
    tags:
      application: message-auth

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
    sun.rmi: info
    javax.management: info
    root: info

security.jwt:
  secret-key: 1234
  expiration-time: 3600000
