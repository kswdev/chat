spring:
  datasource:
    url: jdbc:h2:mem:social;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

message-social:
  message-user:
    base-url: http://localhost:8082
  kafka:
    topics:
      push: push-notification
