global:
  scrape_interval: 15s

scrape_configs:
  - job_name: web-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: message-system
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8070

  - job_name: kafka-exporter
    static_configs:
      - targets:
          - kafka-exporter:9308